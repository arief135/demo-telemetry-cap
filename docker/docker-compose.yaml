# Local observability stack for the CAP telemetry course.
#
#   docker compose up -d
#
# Ports you will actually use:
#   http://localhost:16686  Jaeger UI      (traces)
#   http://localhost:9090   Prometheus     (metrics, raw)
#   http://localhost:3000   Grafana        (metrics, pretty) - login admin/admin
#   localhost:4318          OTLP/HTTP      <- your CAP app sends here
#
# Note: Grafana uses 3000, which is also CAP's default port. The compose file
# maps Grafana to 3000 and this course runs CAP on 4004 to keep them apart.
services:
  # The Collector is the single front door. Your app sends everything here,
  # and the Collector fans traces out to Jaeger and metrics out to Prometheus.
  # In production this is where you'd add sampling, redaction, and batching.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: cap-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP/gRPC in
      - "4318:4318" # OTLP/HTTP in  <- the one this course uses
      - "8889:8889" # Prometheus scrape endpoint out
    depends_on:
      - jaeger
  # Jaeger v2 is built on the OTel Collector and speaks OTLP natively.
  # (Jaeger v1 and the old jaegertracing/all-in-one image are end-of-life.)
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.15.0
    container_name: cap-jaeger
    ports:
      - "16686:16686" # UI
  prometheus:
    image: prom/prometheus:latest
    container_name: cap-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
  grafana:
    image: grafana/grafana:latest
    container_name: cap-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
